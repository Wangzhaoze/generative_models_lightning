root_dir: /home/local/Desktop/code/Datasets/coloradar
output_dir: /home/local/Desktop/code/Datasets/processed_coloradar
voxel_output_dir: /home/local/Desktop/code/Datasets/processed_coloradar/voxel_cache
num_workers: 10
single_chip_mode:
  lidar:
    FOV:
      max_range: 15.863025538680999
      az_range: [-90, 90]
      el_range: [-20, 20]
    
    ###### voxel mode #######
    # pc_range: [0, -15, -5, 15, 15, 5]
    # voxel_size: [0.05, 0.05, 0.05]
    ###### voxel mode end #######

    ###### view cone mode #######
    pc_range: [0, -90, -20, 15.8, 90, 20] # [-r, -az, -el, r, az, el], az and el are in degrees
    voxel_size: [0.05, 0.25, 0.5]  # [r, az, el], in meters and degrees, [316, 720, 80] max
    ###### view cone mode #######

    voxel_max_num_points: 10
    max_voxels: 50000



  radar:
    use_DOA: false
    allow_doa_aperture_truncation: false
    num_range_bins: 128
    range_bin_width: 0.124905712903
    config: data_prepare/dataset_preprocessor/config/1843_coloradar.yml
    antenna_file_path: data_prepare/dataset_preprocessor/config/antenna_array.txt

cascade_mode:
  lidar:
    FOV:
      max_range: 15.189873215311652
      az_range: [-78.32238026939581, 78.32238026939581]
      el_range: [-72.9733859227232, 72.9733859227232]

  radar:
    use_DOA: false
    allow_doa_aperture_truncation: false
    num_range_bins: 256
    range_bin_width: 0.0592943951488
    config: data_prepare/dataset_preprocessor/config/cascade_coloradar.yml
    antenna_file_path: data_prepare/dataset_preprocessor/config/antenna_array_cascade.txt
