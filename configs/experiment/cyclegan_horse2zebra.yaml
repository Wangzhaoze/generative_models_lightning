seed: 42

hydra:
  run:
    dir: outputs/cyclegan_horse2zebra/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false

data_module:
  _target_: data_module.image_translation.UnpairedImageFolderDataModule
  data_dir: ${oc.env:CYCLEGAN_DATA_DIR,./data/horse2zebra}
  batch_size: 1
  num_workers: 0
  image_size: 256
  pin_memory: true
  use_fake_data: false
  fake_train_size: 16
  fake_val_size: 4
  seed: ${seed}

model:
  _target_: generative_models_lightning.gan.CycleGANModule
  input_nc: 3
  output_nc: 3
  ngf: 64
  ndf: 64
  n_blocks: 9
  n_layers_D: 3
  norm: instance
  use_dropout: false
  pool_size: 50
  gan_mode: lsgan
  lambda_source: 10.0
  lambda_target: 10.0
  lambda_identity: 0.5
  lr: 2.0e-4
  beta1: 0.5
  weight_decay: 0.0

trainer:
  _target_: lightning.pytorch.Trainer
  accelerator: auto
  devices: 1
  strategy: auto
  precision: 32-true
  fast_dev_run: false
  max_epochs: 200
  accumulate_grad_batches: 1
  log_every_n_steps: 50
  check_val_every_n_epoch: 1
  default_root_dir: ${hydra:runtime.output_dir}
  enable_checkpointing: true
  enable_progress_bar: true
  callbacks:
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      dirpath: ${hydra:runtime.output_dir}/checkpoints
      filename: "cyclegan-horse2zebra-{epoch:03d}-{step:08d}"
      monitor: val/loss_g
      mode: min
      save_last: true
      save_top_k: 3
      auto_insert_metric_name: false
  logger:
    _target_: lightning.pytorch.loggers.TensorBoardLogger
    save_dir: ${hydra:runtime.output_dir}
    name: tensorboard
