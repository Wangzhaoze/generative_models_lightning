seed: 42

hydra:
  run:
    dir: outputs/flow_cifar10/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false

data_module:
  _target_: data_module.cifar10.CIFAR10DataModule
  data_dir: ${oc.env:DATA_DIR,./data}
  batch_size: 64
  num_workers: 4
  val_size: 5000
  seed: ${seed}
  download: true
  pin_memory: true
  use_fake_data: false
  fake_train_size: 256
  fake_val_size: 64

model:
  _target_: generative_models_lightning.flow.FlowMatchingModule
  sample_shape: [3, 32, 32]
  drop_rate: 0.1
  time_sampling: uniform
  time_scale: 999.0
  ode_method: midpoint
  default_sample_steps: 50
  lr: 2.0e-4
  weight_decay: 0.0
  warmup_steps: 0
  model:
    _target_: generative_models_lightning.backbones.ClassToSpatialCondition
    num_classes: 10
    model:
      _target_: generative_models_lightning.backbones.cond_unet.UNetModel
      image_size: 32
      in_channels: 3
      model_channels: 64
      out_channels: 3
      num_res_blocks: 2
      attention_resolutions: [2]
      num_classes: 10
      dropout: 0.1
      channel_mult: [1, 2, 2]
      conv_resample: true
      dims: 2
      use_checkpoint: false
      use_fp16: false
      num_heads: 4
      num_head_channels: -1
      num_heads_upsample: 4
      use_scale_shift_norm: true
      resblock_updown: true
      use_new_attention_order: false

trainer:
  _target_: lightning.pytorch.Trainer
  accelerator: auto
  devices: 1
  strategy: auto
  precision: 32-true
  fast_dev_run: false
  max_epochs: 100
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  log_every_n_steps: 50
  check_val_every_n_epoch: 1
  default_root_dir: ${hydra:runtime.output_dir}
  enable_checkpointing: true
  enable_progress_bar: true
  callbacks:
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      dirpath: ${hydra:runtime.output_dir}/checkpoints
      filename: "flow-cifar10-{epoch:03d}-{step:08d}"
      monitor: val/loss
      mode: min
      save_last: true
      save_top_k: 3
      auto_insert_metric_name: false
  logger:
    _target_: lightning.pytorch.loggers.TensorBoardLogger
    save_dir: ${hydra:runtime.output_dir}
    name: tensorboard
